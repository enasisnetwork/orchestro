


[project]

name = "orchestro"
description = "Enasis Network Orchestrations"

readme = "README.md"

license.text = "MIT"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"]

requires-python = ">= 3.11"

dynamic = ["version", "dependencies"]



[project.urls]

Source = "https://github.com/enasisnetwork/orchestro"
Documentation = "https://enasisnetwork.github.io/orchestro/sphinx"



[tool.setuptools.dynamic]

version.attr = "orchestro.__version__"

dependencies.file = ["require/install.txt"]



[tool.setuptools.packages.find]

include = ["orchestro", "orchestro.*"]



[tool.ruff.lint.per-file-ignores]

"sphinx/conf.py" = ["E402"]
